name: vibe_check_example
description: Example app demonstrating the vibe_check lint rules.
publish_to: none
version: 1.0.0

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  # flutter_lints is intentionally NOT listed: package:vibe_check/nylo.yaml
  # includes it, and vibe_check depends on it, so it resolves transitively.
  vibe_check:
    path: ../
